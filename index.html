<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Calculadora de IMC criada como exercício de JavaScript e validação de formulários.">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <form class="card" id="imc-form">
      <p class="eyebrow">Exercício JavaScript</p>
      <h1>Calculadora de IMC</h1>
      <p class="intro">Informe altura e peso para calcular o índice de massa corporal.</p>
      <label for="altura">Altura (m)</label>
      <input id="altura" name="altura" type="number" min="0.5" max="2.5" step="0.01" inputmode="decimal" placeholder="1,75" required>
      <label for="peso">Peso (kg)</label>
      <input id="peso" name="peso" type="number" min="10" max="400" step="0.1" inputmode="decimal" placeholder="70" required>
      <button type="submit">Calcular IMC</button>
      <output id="resultado" class="result" aria-live="polite"></output>
      <small>Resultado apenas informativo. IMC não substitui avaliação profissional de saúde.</small>
    </form>
  </main>
  <script src="style.js"></script>
</body>
</html>
